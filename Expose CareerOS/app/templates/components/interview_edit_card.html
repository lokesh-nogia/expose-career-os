<form hx-post="/interviews/{{ question.id }}/edit" 
      hx-target="#interview-wrapper-{{ question.id }}" 
      hx-swap="innerHTML"
      class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-brand-500/30 dark:border-slate-800 rounded-2xl p-5 shadow-md transition-all duration-300 ring-2 ring-brand-500/10 space-y-4">
    
    <span class="text-xs font-bold text-brand-600 dark:text-brand-400 uppercase tracking-wider block mb-1">Editing Question</span>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Company -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Company</label>
            <input type="text" name="company" value="{{ question.company }}" required
                   class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
        </div>

        <!-- Category -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Category</label>
            <input type="text" name="category" value="{{ question.category }}" required
                   class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Difficulty -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Difficulty</label>
            <select name="difficulty" required
                    class="w-full px-2.5 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
                <option value="Easy" {% if question.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Medium" {% if question.difficulty == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Hard" {% if question.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>

        <!-- Score -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Confidence Score (0-10)</label>
            <input type="number" name="score" min="0" max="10" value="{{ question.score }}"
                   class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
        </div>
    </div>

    <!-- Question -->
    <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Question Description</label>
        <textarea name="question" rows="2" required
                  class="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-850 dark:text-slate-100 resize-none focus:ring-1 focus:ring-brand-500">{{ question.question }}</textarea>
    </div>

    <!-- Personal Answer -->
    <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Your Personal Answer Draft</label>
        <textarea name="personal_answer" rows="3"
                  class="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-850 dark:text-slate-100 resize-none focus:ring-1 focus:ring-brand-500">{{ question.personal_answer }}</textarea>
    </div>

    <!-- Feedback -->
    <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Assessed Feedback</label>
        <input type="text" name="feedback" value="{{ question.feedback or '' }}"
               class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-850 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end space-x-2.5 pt-3 border-t border-slate-100 dark:border-slate-800 mt-3">
        <button type="button" 
                hx-get="/interviews/{{ question.id }}/cancel" 
                hx-target="#interview-wrapper-{{ question.id }}" 
                hx-swap="innerHTML"
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-750 text-slate-600 dark:text-slate-350 rounded-lg text-xs font-bold transition-colors">
            Cancel
        </button>
        <button type="submit" 
                class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-bold shadow-sm transition-colors">
            Save Changes
        </button>
    </div>
</form>

<div class="space-y-4" id="interview-cards-grid">
    {% for question in questions %}
        <div id="interview-wrapper-{{ question.id }}">
            {% include 'components/interview_card.html' %}
        </div>
    {% else %}
        <div class="flex flex-col items-center justify-center py-20 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center text-slate-450">
            <div class="w-16 h-16 rounded-full bg-slate-50 dark:bg-slate-950 flex items-center justify-center mb-4 text-slate-350 dark:text-slate-700">
                <i data-lucide="help-circle" class="w-8 h-8 stroke-[1.5]"></i>
            </div>
            <h4 class="text-base font-extrabold text-slate-800 dark:text-white">No questions matched</h4>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-sm">
                Try typing a different search term or category filter, or add a new question entry.
            </p>
        </div>
    {% endfor %}
</div>

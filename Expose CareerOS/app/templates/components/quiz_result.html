<div class="mt-3.5 p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex flex-col sm:flex-row justify-between items-start gap-4 animate-in fade-in slide-in-from-top-1 duration-200">
    <div class="space-y-1">
        <span class="text-[9px] font-black uppercase text-emerald-600 dark:text-emerald-450 tracking-wider block">Assessed Evaluation</span>
        <p class="text-xs font-semibold text-slate-700 dark:text-slate-300 leading-relaxed">{{ feedback }}</p>
    </div>
    
    <div class="shrink-0 flex flex-col items-center justify-center p-2.5 bg-white dark:bg-slate-950 border border-slate-150 dark:border-slate-850 rounded-xl min-w-[70px]">
        <span class="text-xs font-bold text-slate-450 uppercase tracking-widest text-[8px] mb-0.5">Score</span>
        <span class="text-lg font-black text-brand-650 dark:text-brand-400 leading-none">{{ score }}/10</span>
    </div>
</div>

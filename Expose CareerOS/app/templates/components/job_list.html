<div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="job-cards-grid">
    {% for job in jobs %}
        <div id="job-wrapper-{{ job.id }}" class="h-full">
            {% include 'components/job_card.html' %}
        </div>
    {% else %}
        <div class="lg:col-span-2 flex flex-col items-center justify-center py-20 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center text-slate-450">
            <div class="w-16 h-16 rounded-full bg-slate-50 dark:bg-slate-950 flex items-center justify-center mb-4 text-slate-350 dark:text-slate-700">
                <i data-lucide="briefcase" class="w-8 h-8 stroke-[1.5]"></i>
            </div>
            <h4 class="text-base font-extrabold text-slate-800 dark:text-white">No applications match</h4>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-sm">
                Try tweaking your search input, selected filter status, or create a brand new application log.
            </p>
        </div>
    {% endfor %}
</div>

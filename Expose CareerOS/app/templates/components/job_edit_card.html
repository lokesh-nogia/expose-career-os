<form hx-post="/jobs/{{ job.id }}/edit" 
      hx-target="#job-wrapper-{{ job.id }}" 
      hx-swap="innerHTML"
      class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-brand-500/30 dark:border-slate-800 rounded-2xl p-5 shadow-md h-full flex flex-col justify-between space-y-4 transition-all duration-300 ring-2 ring-brand-500/10">
    
    <div class="space-y-3 flex-1">
        <span class="text-xs font-bold text-brand-600 dark:text-brand-400 uppercase tracking-wider block mb-1">Editing Application</span>
        
        <!-- Company Name -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Company</label>
            <input type="text" name="company" value="{{ job.company }}" required
                   class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
        </div>

        <!-- Position -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Position</label>
            <input type="text" name="position" value="{{ job.position }}" required
                   class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <!-- Status -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Status</label>
                <select name="status" required
                        class="w-full px-2.5 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
                    <option value="Wishlist" {% if job.status == 'Wishlist' %}selected{% endif %}>Wishlist</option>
                    <option value="Applied" {% if job.status == 'Applied' %}selected{% endif %}>Applied</option>
                    <option value="Interview" {% if job.status == 'Interview' %}selected{% endif %}>Interview</option>
                    <option value="Offer" {% if job.status == 'Offer' %}selected{% endif %}>Offer</option>
                    <option value="Rejected" {% if job.status == 'Rejected' %}selected{% endif %}>Rejected</option>
                </select>
            </div>

            <!-- Date -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Date</label>
                <input type="date" name="applied_date" value="{{ job.applied_date.isoformat() if job.applied_date else '' }}" required
                       class="w-full px-2.5 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-800 dark:text-slate-100 focus:ring-1 focus:ring-brand-500">
            </div>
        </div>

        <!-- Notes -->
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Notes / Contacts</label>
            <textarea name="notes" rows="2"
                      class="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl outline-none text-xs font-semibold text-slate-850 dark:text-slate-100 resize-none focus:ring-1 focus:ring-brand-500">{{ job.notes }}</textarea>
        </div>
    </div>

    <!-- Buttons -->
    <div class="flex items-center justify-end space-x-2.5 pt-3 border-t border-slate-100 dark:border-slate-800 mt-3">
        <button type="button" 
                hx-get="/jobs/{{ job.id }}/cancel" 
                hx-target="#job-wrapper-{{ job.id }}" 
                hx-swap="innerHTML"
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-750 text-slate-600 dark:text-slate-350 rounded-lg text-xs font-bold transition-colors">
            Cancel
        </button>
        <button type="submit" 
                class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-bold shadow-sm transition-colors">
            Save
        </button>
    </div>
</form>

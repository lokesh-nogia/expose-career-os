<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm hover:shadow-md transition-all h-full flex flex-col justify-between group relative overflow-hidden">
    <!-- Status colored tag strip on top -->
    <div class="absolute top-0 left-0 right-0 h-1.5 
        {% if job.status == 'Wishlist' %} bg-slate-300 dark:bg-slate-700
        {% elif job.status == 'Applied' %} bg-blue-500
        {% elif job.status == 'Interview' %} bg-purple-500
        {% elif job.status == 'Offer' %} bg-emerald-500
        {% elif job.status == 'Rejected' %} bg-rose-500
        {% endif %}">
    </div>

    <div class="pt-2 flex-1">
        <!-- Header: Company & Position -->
        <div class="flex items-start justify-between gap-3 mb-3">
            <div>
                <h4 class="font-extrabold text-slate-800 dark:text-white group-hover:text-brand-600 dark:group-hover:text-brand-450 transition-colors text-base">{{ job.company }}</h4>
                <p class="text-sm font-semibold text-slate-650 dark:text-slate-300 mt-0.5">{{ job.position }}</p>
            </div>
            
            <!-- Status Badge -->
            <span class="text-xs px-2.5 py-1 rounded-lg font-bold border 
                {% if job.status == 'Wishlist' %} bg-slate-50 dark:bg-slate-800/40 text-slate-600 dark:text-slate-400 border-slate-200/50 dark:border-slate-700/50
                {% elif job.status == 'Applied' %} bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-450 border-blue-200/40 dark:border-blue-900/30
                {% elif job.status == 'Interview' %} bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-450 border-purple-200/40 dark:border-purple-900/30
                {% elif job.status == 'Offer' %} bg-emerald-50 dark:bg-emerald-900/20 text-emerald-650 dark:text-emerald-450 border-emerald-200/40 dark:border-emerald-900/30
                {% elif job.status == 'Rejected' %} bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-450 border-rose-200/40 dark:border-rose-900/30
                {% endif %}">
                {{ job.status }}
            </span>
        </div>

        <!-- Date applied -->
        <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400 mb-4 bg-slate-50 dark:bg-slate-950/60 px-3 py-1.5 rounded-lg w-max border border-slate-100 dark:border-slate-850">
            <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-450"></i>
            <span>Applied on {{ job.applied_date.strftime("%B %d, %Y") if job.applied_date else "N/A" }}</span>
        </div>

        <!-- Notes -->
        {% if job.notes %}
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed border-t border-dashed border-slate-100 dark:border-slate-800 pt-3">
                {{ job.notes }}
            </p>
        {% else %}
            <p class="text-xs text-slate-400 dark:text-slate-600 italic border-t border-dashed border-slate-100 dark:border-slate-800 pt-3">
                No reminders or notes added yet.
            </p>
        {% endif %}
    </div>

    <!-- Actions Footer -->
    <div class="flex items-center justify-end space-x-3.5 pt-4 border-t border-slate-50 dark:border-slate-800/60 mt-4 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <!-- Edit Trigger -->
        <button hx-get="/jobs/{{ job.id }}/edit" 
                hx-target="#job-wrapper-{{ job.id }}" 
                hx-swap="innerHTML"
                class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-450 hover:text-slate-700 dark:hover:text-slate-200 rounded-lg transition-colors"
                title="Edit Application">
            <i data-lucide="edit-2" class="w-4 h-4"></i>
        </button>
        
        <!-- Delete Trigger -->
        <button hx-delete="/jobs/{{ job.id }}" 
                hx-target="#job-wrapper-{{ job.id }}" 
                hx-swap="delete" 
                hx-confirm="Are you sure you want to delete this job application?"
                class="p-2 hover:bg-rose-50 dark:hover:bg-rose-950/20 text-slate-450 hover:text-rose-600 dark:hover:text-rose-450 rounded-lg transition-colors"
                title="Delete Application">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
    </div>
</div>
